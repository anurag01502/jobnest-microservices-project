
name: Auth Service CI

# Trigger pipeline whenever code is pushed
# or a pull request is created.

on:
  push:
  pull_request:

jobs:
  build:

    # GitHub provides a temporary Ubuntu machine.
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 21
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build application and execute tests
      - name: Build and test
        run: mvn -B clean verify
