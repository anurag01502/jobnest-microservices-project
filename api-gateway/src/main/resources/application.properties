spring.application.name=api-gateway

server.port=8080

# JWT
jwt.secret=MyVerySecretKeyThatIsAtLeast32CharactersLong123

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Company Service
 spring.cloud.gateway.routes[1].id=company-service
 spring.cloud.gateway.routes[1].uri=http://localhost:8082
 spring.cloud.gateway.routes[1].predicates[0]=Path=/company/**

#  job Service
spring.cloud.gateway.routes[2].id=job-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/job/**