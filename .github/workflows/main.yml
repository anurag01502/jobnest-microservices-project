
name: JobNest Microservices CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  auth-service-build:

    name: Build Auth Service
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: auth-service/pom.xml

      # 3. Build and test
      - name: Build and test Auth Service
        working-directory: auth-service
        run: mvn -B clean verify

      # 4. Display build success
      - name: Build completed
        run: echo "Auth Service CI completed successfully!"
